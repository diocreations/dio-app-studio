name: offsite backup

# Daily production backup into a separate R2 bucket.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   D1 read + backup bucket object read/write + media read
#                          (the backup and the sweep also list buckets to catch a
#                           mistyped name, which needs account-level R2 read)
#   CLOUDFLARE_ACCOUNT_ID
#   BACKUP_ALERT_WEBHOOK   Slack/Discord incoming webhook (optional but recommended)
#   BACKUP_HEARTBEAT_URL   dead-man switch pinged only after a verified run
#
# This workflow only runs once the repository has a remote. Until then the same
# command runs from cron; see docs/PRODUCTION_DISASTER_RECOVERY.md.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      keep:
        description: Verified runs to keep
        required: false
        default: '7'

concurrency:
  group: offsite-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the backup tools compile
        run: bun run typecheck

      - name: Run the backup
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_ALERT_WEBHOOK: ${{ secrets.BACKUP_ALERT_WEBHOOK }}
          BACKUP_HEARTBEAT_URL: ${{ secrets.BACKUP_HEARTBEAT_URL }}
        run: |
          bun scripts/offsite-backup.mjs \
            --remote \
            --database plattr-studio \
            --bucket plattr-media \
            --backup-bucket plattr-backups \
            --keep "${{ github.event.inputs.keep || '7' }}"

      - name: Sweep abandoned runs
        # Runs that failed before verifying stay in the index as `pending` and
        # their objects stay in the bucket. This removes them once they are old
        # enough that they cannot still be uploading, and never touches a
        # verified run. It runs after a failed backup too: yesterday's leftover
        # is still yesterday's leftover.
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          bun scripts/backup-sweep.mjs \
            --remote \
            --backup-bucket plattr-backups \
            --older-than 360 \
            --execute

      - name: Explain the failure
        if: failure()
        run: |
          echo "::error::The backup did not verify. Do not assume yesterday's snapshot is still the newest. Check plattr/index.json, then run the job manually."
